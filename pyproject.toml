[project]
name = "curat0r"
version = "0.0.1"
description = "Curate a resume from the work you have actually done."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Pinned exactly, and to the same versions auto_Interner uses. A floating
# ">=" means CI resolves whatever is newest that morning, so a green run can
# go red with no commit behind it. Both repositories should fail for the same
# reasons on the same day.
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.9",
  # starlette.testclient refuses to import without it, so tests/test_web.py
  # fails at collection and takes the whole run down with it. Test-only; the
  # runtime dependency list above stays empty.
  "httpx2==2.12.0",
]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# Selection lives in auto_interner.corpus. Curat0r does not vendor a copy;
# install it alongside:  pip install -e ../auto_Interner
engine = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# EXE002 fires on every file because the working tree lives on a mount that
# marks everything executable. That is a property of the filesystem, not of the
# code, and chmod does not survive there -- so it would be noise on every run.
ignore = ["EXE002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# The selection engine lives in the other repository and CI installs only
# .[web,dev], so these imports are unresolvable here by design rather than by
# accident. Phase 1.5 moves auto_interner.corpus into this package; when it
# lands, the dependency goes and this override goes with it.
[[tool.mypy.overrides]]
module = ["auto_interner.*"]
ignore_missing_imports = true
