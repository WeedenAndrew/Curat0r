# One command, same result everywhere:  docker compose run --rm gate
#
# The point is not convenience. On 2026-08-19 the mypy gate could not be run at
# all on the machine doing the work, because the interpreter was 3.10 and the
# project targets 3.12. That gate then shipped to CI unverified and failed.

services:
  gate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /work
    # Source is mounted read-only so the gate cannot rewrite what it is judging.
    volumes:
      - ./src:/work/src:ro
      - ./tests:/work/tests:ro
      - ./pyproject.toml:/work/pyproject.toml:ro
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=10001,gid=10001
      - /work/.mypy_cache:size=128m,uid=10001,gid=10001
      - /work/.pytest_cache:size=64m,uid=10001,gid=10001
      - /work/.ruff_cache:size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1024m

  # The web app, for the 60-second demo in the README.
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["python", "-m", "uvicorn", "curat0r.web.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    profiles: ["demo"]
