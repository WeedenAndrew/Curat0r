# Dependency lock for the quality gate. Python 3.12, resolved 2026-08-19.
#
# Why the file exists: exact pins in pyproject.toml freeze the direct tools
# only. Without a lock the transitive set resolves fresh on every install, and
# coverage, pluggy, starlette or pathspec moving is enough to change what a
# linter or type checker reports on unchanged code.
#
# How this one was produced, and a trap to avoid. The obvious command
#
#     docker compose run --rm --entrypoint pip gate freeze | sort
#
# does NOT regenerate anything. Dockerfile.dev installs this lock first, so
# freezing inside the image returns the same file it was built from. Run
# verbatim against the 3.10 bootstrap it produced a byte-identical body,
# backports included. Resolve from pyproject.toml on a clean 3.12 interpreter
# instead:
#
#     docker run --rm -v "$PWD:/repo:ro" python:3.12.13-slim-bookworm sh -c \
#       'cp -r /repo /build && cd /build && rm -f requirements-dev.lock \
#        && pip install -q ".[web,dev]" && pip freeze' | sort
#
# Then drop the local editable line. Refreshing against new upstream releases
# requires that clean resolve; the in-image freeze cannot see drift.
#
# What the 3.10 bootstrap had wrong, now corrected:
#   - tomli and exceptiongroup, backports 3.12 does not need. Both gone.
#   - websockets pinned at 16.1.1. The real 3.12 resolve is 17.0.1.
#
# Three failed attempts before this one, all worth recording:
#   1. `pip freeze` in a shared environment. 167 packages including Flask,
#      ImageIO and Babel, none of which this project uses.
#   2. A clean virtualenv, but on 3.10. Correct package set, wrong interpreter.
#   3. The in-image freeze above. Circular; returned the 3.10 set unchanged.

